name: pipeline

# mt5-httpapi ships as a docker-compose / Windows-VM stack, not a single
# pushable image, so there's no docker-image build in CI. Beyond running the
# test suite, this pipeline validates the agent skill and OpenClaw plugin under
# .agents/ on every push and publishes both to ClawHub on tag pushes.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  # Keep the caller's group distinct from groups inside reusable workflows.
  # Identical groups deadlock when this workflow waits for a called workflow.
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # `make test` is the full automated suite: offline unit/contract tests plus
  # the container-backed nginx and MCP-unifier tests. It is NOT the
  # python-package-workflow caller: that pipeline expects a dist/, and this
  # repo builds no package.
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Anonymous Docker Hub pulls are rate limited per runner IP, which the
      # hosted runners share, and the suite pulls its base images from there.
      # The script retries and falls back to anonymous pulls; fork pull
      # requests get no secrets and pull anonymously.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: scripts/ci-dockerhub-login.sh
      - name: Run the test suite
        run: make test

  # Shell + PowerShell linting (shellcheck / shfmt / PSScriptAnalyzer). This was
  # never wired into CI, so master reached a shfmt-dirty state without anything
  # noticing.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: scripts/ci-dockerhub-login.sh
      - name: Lint
        run: make lint

  badges:
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  # The mt5-httpapi skill (.agents/skills/mt5-httpapi) and the OpenClaw plugin
  # (.agents/plugins/mt5-httpapi) on ClawHub. The reusable workflow validates
  # both on every call and publishes only on a tag, after that validation. The
  # skill version mirrors the tag; the plugin's comes from its package.json,
  # which the release bumps. Gated on the suite so a failing tag never reaches
  # ClawHub. Pull requests from forks are skipped: they get no CLAWHUB_TOKEN,
  # and the skill dry-run needs it.
  clawhub:
    needs: [test, lint]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      publish_skills: true
      publish_plugins: true
      skill_names: '["mt5-httpapi"]'
      plugin_names: '["mt5-httpapi"]'
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}
